<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14231f" />
  <title>离线 · Offline</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Avenir Next", "Segoe UI Variable", "Noto Sans SC",
                   "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(24px, env(safe-area-inset-top))
               max(24px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(24px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 12%, rgba(13, 118, 107, 0.12), transparent 32rem),
        #f1f0e9;
      color: #17211e;
    }
    main {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid #d9ddd7;
      border-radius: 24px;
      background: #fbfaf6;
      box-shadow: 0 28px 70px rgba(27, 43, 37, 0.12);
      text-align: left;
    }
    .icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #dceee9;
      color: #07544d;
      font-size: 1.25rem;
    }
    h1 {
      margin: 26px 0 10px;
      font-family: ui-serif, "Iowan Old Style", "Songti SC", serif;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      color: #60706a;
      font-size: 0.86rem;
      line-height: 1.7;
    }
    .english { margin-top: 12px; }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 26px;
      border: 0;
      border-radius: 13px;
      background: #17211e;
      color: #fbfaf6;
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
    }
    button:focus-visible {
      outline: 3px solid rgba(13, 118, 107, 0.3);
      outline-offset: 3px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #101714; color: #eff4f0; }
      main {
        border-color: #34423d;
        background: #17201d;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.34);
      }
      p { color: #a4b2ac; }
      .icon { background: #203f39; color: #a8e7dc; }
      button { background: #63cbbb; color: #101714; }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✓</div>
    <h1>网络暂时不可用</h1>
    <p>如果你已打开过生成器，返回上一页仍可离线使用。否则，请在恢复连接后重试。</p>
    <p class="english">You are offline. If the generator was opened before, go back to keep using it offline. Otherwise, reconnect and retry.</p>
    <button type="button" onclick="location.reload()">重试 · Retry</button>
  </main>
</body>
</html>
